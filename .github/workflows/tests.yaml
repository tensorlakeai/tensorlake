name: Tests

on:
  workflow_dispatch:

  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  public_source_checks:
    name: Public Python source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.0.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install public dependencies and check formatting
        run: poetry install --no-root --with=dev && make check

      - name: Run public Python unit tests
        env:
          PYTHONPATH: src:tests/applications
        run: |
          set -euo pipefail
          for module in \
            tests.applications.test_application_manifest \
            tests.applications.test_code_zip \
            tests.applications.test_future_validation \
            tests.applications.test_parse_gitignore \
            tests.applications.test_request_context_headers \
            tests.utils.test_retries \
            tests.sandbox.test_timestamps
          do
            poetry run python -m unittest "$module"
          done

  rust_public_workspace:
    name: Rust SDK and CLI tests
    runs-on: ubuntu-latest-xlarge
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Build TypeScript SDK and runner capsules for CLI tests
        working-directory: typescript
        run: |
          npm ci --ignore-scripts
          npm run build:sdk
          npm run build:runtime

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-public-ci
          cache-bin: false

      # Mount, git-clone, and Function Agent require private sources and are
      # excluded from public CI. Release builds in CEI still include them.
      - name: Test public Rust SDK and CLI
        run: cargo test --locked -p tensorlake -p tensorlake-cli

      - name: Lint public Rust SDK and CLI
        run: cargo clippy --locked -p tensorlake -p tensorlake-cli --all-targets -- -D warnings

  windows_build_smoke:
    name: Windows build smoke test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build tensorlake wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_DIR: target
        with:
          target: x86_64-pc-windows-msvc
          args: --release --no-default-features --out dist
          sccache: 'true'

      - name: Verify wheel imports Rust Cloud SDK extension
        run: |
          python .github/scripts/verify_wheel.py "dist/tensorlake-*.whl" tensorlake._cloud_sdk tensorlake.cli.deploy --expect-script function-executor --expect-script tensorlake-python-function-runner --expect-script tensorlake-deploy --reject-script tl --reject-script tensorlake

      - name: Build Node.js native binding
        env:
          CARGO_TARGET_DIR: target
        run: cargo build --locked --release --no-default-features -p tensorlake-rust-cloud-sdk-node --target x86_64-pc-windows-msvc

      - name: Build public Windows CLI
        run: cargo build --release -p tensorlake-cli --bin tensorlake --target x86_64-pc-windows-msvc

      - name: Verify Windows CLI binary starts
        run: ./target/x86_64-pc-windows-msvc/release/tensorlake.exe --version

  run_tests:
    name: Lint and test
    runs-on: ubuntu-latest-xlarge
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: "pip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-bin
          cache-bin: false

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.0.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install, build Rust SDK extension, and lint tensorlake
        run: poetry install --no-root --with=dev && poetry run maturin develop --no-default-features && make check

      - name: Run sandbox/image SDK unit tests
        env:
          PYTHONPATH: src
        run: |
          poetry run python -m unittest \
            tests.sandbox.test_client_rust_backend \
            tests.sandbox.test_client_rust_backend_async \
            tests.sandbox.test_sandbox_rust_backend \
            tests.sandbox.test_sandbox_rust_backend_async \
            tests.sandbox.test_output_limit \
            tests.sandbox.test_file_systems \
            tests.sandbox.test_timestamps \
            tests.sandbox.test_get_or_create \
            tests.sandbox.test_gpu_allocations \
            tests.sandbox.test_pool_gpu \
            tests.sandbox.test_ready_timeout \
            tests.sandbox.test_resource_resize \
            tests.sandbox.test_auto_resume_rust_backend \
            tests.sandbox.test_auto_resume_transport \
            tests.image.test_sandbox_builder \
            tests.image.test_builds \
            tests.image.test_builds_native \
            tests.image.test_docker_config_native \
            tests.function_agent.test_runner \
            tests.test_usage

  test_sandbox:
    name: Sandbox integration tests
    # The dev environment permits only main, not PR merge refs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-bin
          cache-bin: false

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.0.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Python dependencies
        run: poetry install --no-root --with=dev && poetry run maturin develop --no-default-features

      - name: Run Sandbox integration tests
        run: poetry run python tests/sandbox/test_lifecycle.py -v
        env:
          TENSORLAKE_API_URL: https://api.tensorlake.dev
          TENSORLAKE_API_KEY: ${{ secrets.TENSORLAKE_API_KEY }}
          TENSORLAKE_TEST_CLEANUP_GRACE_SECS: "60"
