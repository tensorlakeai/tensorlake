name: TypeScript SDK Tests

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "typescript/**"
      - "crates/rust-cloud-sdk-node/**"
      - "crates/function-agent-core/**"
      - "Cargo.lock"
      - "proto/**"
      - "src/tensorlake/applications/**"
      - "src/tensorlake/function_executor/**"
      - "src/tensorlake/function_agent/**"
      - "tests/function_agent/**"
      - "tests/function_executor_compatibility/**"
      - "Makefile"
      - ".github/workflows/typescript_sdk.yaml"

  push:
    branches:
      - "main"
    paths:
      - "typescript/**"
      - "crates/rust-cloud-sdk-node/**"
      - "crates/function-agent-core/**"
      - "Cargo.lock"
      - "proto/**"
      - "src/tensorlake/applications/**"
      - "src/tensorlake/function_executor/**"
      - "src/tensorlake/function_agent/**"
      - "tests/function_agent/**"
      - "tests/function_executor_compatibility/**"
      - "Makefile"
      - ".github/workflows/typescript_sdk.yaml"

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: typescript

jobs:
  function-executor-compatibility:
    name: Python/TypeScript function executor compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-bin
          cache-bin: false

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.0.0
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install TypeScript dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: poetry install --with=dev

      - name: Verify the shared protocol and generated Python bindings
        working-directory: ${{ github.workspace }}
        run: |
          npm --prefix typescript run check:proto
          make build_proto
          git diff --exit-code -- src/tensorlake/function_executor/proto

      - name: Run shared function executor compatibility harness
        working-directory: ${{ github.workspace }}
        run: make test_function_executor_compatibility

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-bin
          cache-bin: false

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-gnu x86_64-unknown-linux-musl

      - name: Install dependencies
        run: npm ci

      - name: Check shared function-executor protocol source
        run: npm run check:proto

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build SDK
        run: npm run build:sdk

      - name: Run snapshot-focused SDK unit tests
        run: npm test -- tests/client.test.ts tests/sandbox-image.test.ts

      - name: Build native binding (glibc compatibility smoke)
        run: npm run build:native
        env:
          TENSORLAKE_NODE_TARGET_ID: linux-x64
          TENSORLAKE_NODE_TARGET_TRIPLE: x86_64-unknown-linux-gnu.2.28
          TENSORLAKE_NODE_BUILD_TOOL: cargo-zigbuild

      - name: Verify native glibc floor
        run: |
          set -euo pipefail
          binding="dist/native/linux-x64/tensorlake-node.node"
          required_versions="$(readelf --version-info "$binding" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)"
          max_glibc="$(printf '%s\n' "$required_versions" | tail -n1)"
          echo "Maximum required glibc: ${max_glibc:-none}"
          if [ -n "$max_glibc" ] && [ "$(printf '%s\n%s\n' "GLIBC_2.28" "$max_glibc" | sort -V | tail -n1)" != "GLIBC_2.28" ]; then
            echo "Native binding requires $max_glibc, above the GLIBC_2.28 compatibility floor."
            exit 1
          fi

      - name: Build native binding (musl smoke)
        run: npm run build:native
        env:
          TENSORLAKE_NODE_TARGET_ID: linux-x64-musl
          TENSORLAKE_NODE_TARGET_TRIPLE: x86_64-unknown-linux-musl
          TENSORLAKE_NODE_BUILD_TOOL: cargo-zigbuild

      - name: Verify musl native binding does not require glibc
        run: |
          set -euo pipefail
          binding="dist/native/linux-x64-musl/tensorlake-node.node"
          required_versions="$(readelf --version-info "$binding" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)"
          if [ -n "$required_versions" ]; then
            echo "Musl native binding unexpectedly references glibc symbols:"
            printf '%s\n' "$required_versions"
            exit 1
          fi

      - name: Build and verify Function Service runner capsule
        run: npm run build:runtime

  integration-tests:
    name: Integration tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-bin
          cache-bin: false

      - name: Build native binding
        run: npm run build:native

      - name: Wait for Python sandbox integration
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow tests.yaml \
              --json databaseId,headSha \
              --limit 20 \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" \
              | head -n 1)

            if [ -n "$run_id" ]; then
              job=$(gh run view "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --json jobs \
                --jq '.jobs[] | select(.name == "Sandbox integration tests") | "\(.status)\t\(.conclusion // "")"')
              status=$(printf '%s' "$job" | cut -f 1)
              conclusion=$(printf '%s' "$job" | cut -f 2)

              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                exit 0
              fi
              if [ "$status" = "completed" ]; then
                echo "Sandbox integration tests completed with conclusion: $conclusion"
                exit 1
              fi
            fi

            sleep 15
          done

          echo "Timed out waiting for Sandbox integration tests"
          exit 1

      - name: Run integration tests
        run: npm run test:integration
        env:
          TENSORLAKE_API_KEY: ${{ secrets.TENSORLAKE_API_KEY }}
          TENSORLAKE_ORGANIZATION_ID: ${{ vars.TENSORLAKE_ORGANIZATION_ID }}
          TENSORLAKE_PROJECT_ID: ${{ vars.TENSORLAKE_PROJECT_ID }}
          TENSORLAKE_TEST_CLEANUP_GRACE_SECS: "60"
