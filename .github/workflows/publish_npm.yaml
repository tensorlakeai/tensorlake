name: Release - TypeScript SDK (npm)

run-name: "Release - TypeScript SDK (npm) · ${{ github.ref_name }} · @${{ github.actor }}"

# Every package requires staged publishing: this workflow uploads versions with
# `npm stage publish`, and a maintainer approves each one on npmjs.com (or with
# `npm stage approve`) before it becomes public. Native packages are staged as
# the exact tarballs this workflow packs, so their checksums can be locked into
# the SDK before anything is public. Approve in this order:
#
#   1. the six @tensorlakeai/native-* packages,
#   2. @tensorlakeai/tensorlake,
#   3. the `tensorlake` wrapper,
#
# so no public package ever depends on a version that is still staged. After
# staging, `announce-approval` lists the staged packages in the run summary and
# on Slack, and `await-approval` keeps the run in progress until every package
# is public. It fails, which emails whoever triggered the run, if approval takes
# longer than APPROVAL_TIMEOUT_MINUTES or happens out of order. Set the
# NPM_APPROVERS_SLACK_MENTION repository variable (e.g. `<!subteam^S0123>`) to
# ping the approvers.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # `npm stage` requires npm 11.15.0 or newer.
  NPM_VERSION: "11.15.0"
  APPROVAL_TIMEOUT_MINUTES: "120"

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  notify-start:
    name: Notify Slack that the release is starting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read SDK version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        continue-on-error: true
        uses: ./.github/actions/notify-release
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          package: TypeScript SDK (npm)
          version: ${{ steps.version.outputs.version }}
          package-url: https://www.npmjs.com/package/@tensorlakeai/tensorlake/v/${{ steps.version.outputs.version }}

  build-sdk-and-test:
    name: Build SDK and test
    runs-on: [self-hosted, tensorlake, tensorlake-medium]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Reject install lifecycle scripts
        run: node ./scripts/check-no-install-scripts.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build SDK
        run: npm run build:sdk

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: |
            typescript/dist
            typescript/runtime

  build-native-binaries:
    name: Build native binding (${{ matrix.target_id }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: [self-hosted, tensorlake, tensorlake-xlarge]
            target_id: linux-x64
            rust_target: x86_64-unknown-linux-gnu.2.28
            rust_target_base: x86_64-unknown-linux-gnu
            libc: gnu
            native_build_tool: cargo-zigbuild
          - os: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
            target_id: linux-arm64
            rust_target: aarch64-unknown-linux-gnu.2.28
            rust_target_base: aarch64-unknown-linux-gnu
            libc: gnu
            native_build_tool: cargo-zigbuild
          - os: ubuntu-latest
            runner: [self-hosted, tensorlake, tensorlake-xlarge]
            target_id: linux-x64-musl
            rust_target: x86_64-unknown-linux-musl
            rust_target_base: x86_64-unknown-linux-musl
            libc: musl
            native_build_tool: cargo-zigbuild
          - os: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
            target_id: linux-arm64-musl
            rust_target: aarch64-unknown-linux-musl
            rust_target_base: aarch64-unknown-linux-musl
            libc: musl
            native_build_tool: cargo-zigbuild
          - os: macos-14
            runner: macos-14
            target_id: darwin-arm64
            rust_target: ""
            rust_target_base: ""
            libc: ""
            native_build_tool: cargo
          - os: windows-latest
            runner: windows-latest
            target_id: win32-x64
            rust_target: ""
            rust_target_base: ""
            libc: ""
            native_build_tool: cargo
    steps:
      - uses: actions/checkout@v4

      - name: Vendor canonical Function Agent core
        uses: ./.github/actions/vendor-function-agent-core
        with:
          app-id: ${{ secrets.COMPUTE_ENGINE_APP_ID }}
          private-key: ${{ secrets.COMPUTE_ENGINE_APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Setup Zig
        if: matrix.native_build_tool == 'cargo-zigbuild'
        uses: mlugg/setup-zig@v2

      - name: Cache Rust build artifacts (Tensorlake)
        if: matrix.target_id == 'linux-x64' || matrix.target_id == 'linux-x64-musl'
        uses: ./.github/actions/setup-tensorlake-rust-cache
        with:
          cache-namespace: npm-native-${{ matrix.target_id }}

      - name: Cache Rust build artifacts (hosted runners)
        if: matrix.target_id != 'linux-x64' && matrix.target_id != 'linux-x64-musl'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-bin
          cache-bin: false

      - name: Install cargo-zigbuild
        if: matrix.native_build_tool == 'cargo-zigbuild'
        run: cargo install cargo-zigbuild --locked

      - name: Install Rust target
        if: matrix.rust_target_base != ''
        run: rustup target add ${{ matrix.rust_target_base }}

      - name: Reject install lifecycle scripts
        run: node ./scripts/check-no-install-scripts.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native binding
        run: npm run build:native
        env:
          TENSORLAKE_NODE_TARGET_ID: ${{ matrix.target_id }}
          TENSORLAKE_NODE_TARGET_TRIPLE: ${{ matrix.rust_target }}
          TENSORLAKE_NODE_BUILD_TOOL: ${{ matrix.native_build_tool }}

      - name: Verify Linux native libc compatibility
        if: startsWith(matrix.target_id, 'linux-')
        run: |
          set -euo pipefail
          binding="dist/native/${{ matrix.target_id }}/tensorlake-node.node"
          required_versions="$(readelf --version-info "$binding" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)"
          max_glibc="$(printf '%s\n' "$required_versions" | tail -n1)"
          echo "Maximum required glibc: ${max_glibc:-none}"
          if [ "${{ matrix.libc }}" = "musl" ] && [ -n "$max_glibc" ]; then
            echo "Musl native binding unexpectedly references glibc symbols."
            exit 1
          fi
          if [ "${{ matrix.libc }}" = "gnu" ] && [ -n "$max_glibc" ] && [ "$(printf '%s\n%s\n' "GLIBC_2.28" "$max_glibc" | sort -V | tail -n1)" != "GLIBC_2.28" ]; then
            echo "Native binding requires $max_glibc, above the GLIBC_2.28 compatibility floor."
            exit 1
          fi

      - name: Verify native cloud transport on host targets
        if: "!endsWith(matrix.target_id, '-musl')"
        run: npm run test:native-cloud

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target_id }}
          path: typescript/dist/native/${{ matrix.target_id }}

  stage-native-binaries:
    name: Stage native package (${{ matrix.target_id }})
    needs:
      - build-native-binaries
    runs-on: [self-hosted, tensorlake, tensorlake-small]
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ matrix.package_name }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: linux-x64
            package_name: "@tensorlakeai/native-linux-x64-gnu"
          - target_id: linux-arm64
            package_name: "@tensorlakeai/native-linux-arm64-gnu"
          - target_id: linux-x64-musl
            package_name: "@tensorlakeai/native-linux-x64-musl"
          - target_id: linux-arm64-musl
            package_name: "@tensorlakeai/native-linux-arm64-musl"
          - target_id: darwin-arm64
            package_name: "@tensorlakeai/native-darwin-arm64"
          - target_id: win32-x64
            package_name: "@tensorlakeai/native-win32-x64"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with staged publishing
        run: |
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          npm --version

      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target_id }}
          path: typescript/npm/${{ matrix.target_id }}

      - name: Verify native package contents
        run: |
          test -f "npm/${{ matrix.target_id }}/tensorlake-node.node"
          test "$(node -p "require('./npm/${{ matrix.target_id }}/package.json').name")" = "${{ matrix.package_name }}"
          npm pack "./npm/${{ matrix.target_id }}" --dry-run --ignore-scripts

      - name: Pack native package
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/native-tarball" "$RUNNER_TEMP/native-integrity"
          npm pack "./npm/${{ matrix.target_id }}" --ignore-scripts --json --pack-destination "$RUNNER_TEMP/native-tarball" > "$RUNNER_TEMP/pack.json"
          node ./scripts/record-native-integrity.mjs "$RUNNER_TEMP/pack.json" "$RUNNER_TEMP/native-tarball" "$RUNNER_TEMP/native-integrity/${{ matrix.target_id }}.json"

      # Stage the tarball that was just checksummed, so the integrity locked
      # into the SDK matches the artifact users will install.
      - name: Stage native package on npm
        run: npm stage publish "${{ steps.pack.outputs.tarball }}" --access public --provenance

      - name: Upload native integrity record
        uses: actions/upload-artifact@v4
        with:
          name: native-integrity-${{ matrix.target_id }}
          path: ${{ runner.temp }}/native-integrity/${{ matrix.target_id }}.json

  stage-sdk:
    name: Stage SDK on npm
    needs:
      - build-sdk-and-test
      - stage-native-binaries
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tensorlakeai/tensorlake
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with staged publishing
        run: |
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          npm --version

      - name: Reject install lifecycle scripts
        run: node ./scripts/check-no-install-scripts.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download native integrity records
        uses: actions/download-artifact@v4
        with:
          pattern: native-integrity-*
          merge-multiple: true
          path: ${{ runner.temp }}/native-integrity

      - name: Lock staged native package checksums
        run: node ./scripts/lock-native-integrity.mjs "$RUNNER_TEMP/native-integrity"

      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: typescript

      - name: Verify package contents
        run: |
          npm run build:runtime
          test -f runtime/typescript-function-runner/manifest.json
          test -z "$(find dist runtime -type f -name '*.node' -print -quit)"
          npm pack --dry-run --ignore-scripts

      - name: Stage SDK on npm
        env:
          npm_config_ignore_scripts: "true"
        run: npm stage publish --access public --provenance

  stage-wrapper:
    name: Stage tensorlake wrapper on npm
    needs:
      - stage-sdk
    continue-on-error: true
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/tensorlake
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript/tensorlake-wrapper
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with staged publishing
        run: |
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          npm --version

      - name: Verify wrapper pins this SDK release
        run: |
          sdk_version="$(node -p "require('../package.json').version")"
          test "$(node -p "require('./package.json').version")" = "$sdk_version"
          test "$(node -p "require('./package.json').dependencies['@tensorlakeai/tensorlake']")" = "$sdk_version"
          npm pack --dry-run --ignore-scripts

      - name: Stage wrapper on npm
        id: stage
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm stage publish --access public --provenance
          echo "staged=true" >> "$GITHUB_OUTPUT"

  # A separate job from the wait, because GitHub shows a job's summary only once
  # the job finishes.
  announce-approval:
    name: Announce staged npm packages
    needs:
      - stage-sdk
      - stage-wrapper
    # The wrapper is staged on a best-effort basis; include it only if it was staged.
    if: ${{ !cancelled() && needs.stage-sdk.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      INCLUDE_WRAPPER: ${{ needs.stage-wrapper.outputs.staged == 'true' }}
    outputs:
      version: ${{ steps.staged.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: List staged packages
        id: staged
        run: node ./scripts/await-npm-approval.mjs announce

      - name: Notify Slack that packages await approval
        continue-on-error: true
        uses: ./.github/actions/notify-npm-approval
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          mention: ${{ vars.NPM_APPROVERS_SLACK_MENTION }}
          title: ":hourglass_flowing_sand: TypeScript SDK ${{ steps.staged.outputs.version }} is staged on npm and needs approval"
          details: "Approve on npmjs.com (or `npm stage approve STAGE_ID`) in this order:\n${{ steps.staged.outputs.packages }}"

  await-approval:
    name: Wait for npm approval
    needs:
      - stage-wrapper
      - announce-approval
    if: ${{ !cancelled() && needs.announce-approval.result == 'success' }}
    runs-on: ubuntu-latest
    # Backstop above APPROVAL_TIMEOUT_MINUTES, so the script reports the timeout.
    timeout-minutes: 140
    env:
      INCLUDE_WRAPPER: ${{ needs.stage-wrapper.outputs.staged == 'true' }}
      VERSION: ${{ needs.announce-approval.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Wait until every package is public
        id: wait
        run: node ./scripts/await-npm-approval.mjs wait

      - name: Notify Slack that the release is public
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-npm-approval
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: ":white_check_mark: TypeScript SDK ${{ env.VERSION }} is public on npm"
          details: "<https://www.npmjs.com/package/@tensorlakeai/tensorlake/v/${{ env.VERSION }}|@tensorlakeai/tensorlake@${{ env.VERSION }}>"

      - name: Notify Slack that approval is incomplete
        if: failure() && steps.wait.outputs.failure != ''
        continue-on-error: true
        uses: ./.github/actions/notify-npm-approval
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          mention: ${{ vars.NPM_APPROVERS_SLACK_MENTION }}
          title: ":x: TypeScript SDK ${{ env.VERSION }} npm approval is incomplete"
          details: ${{ steps.wait.outputs.failure }}
