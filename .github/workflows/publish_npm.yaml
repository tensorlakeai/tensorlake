name: Release - TypeScript SDK (npm)

run-name: "Release - TypeScript SDK (npm) · ${{ inputs.phase }} · ${{ github.ref_name }} · @${{ github.actor }}"

# Every package requires staged publishing: this workflow uploads versions with
# `npm stage publish`, and a maintainer approves each one on npmjs.com (or with
# `npm stage approve`) before it becomes public. A release runs in two phases:
#
#   1. `native`: build and stage the six @tensorlakeai/native-* packages.
#      Approve all six before continuing.
#   2. `sdk`: lock the approved native checksums, then stage
#      @tensorlakeai/tensorlake and, last, the `tensorlake` wrapper.
#      Approve the SDK before the wrapper so `npm install tensorlake` never
#      resolves a wrapper whose dependency is not public yet.
#
# Trusted publishing is bound to this workflow file, so both phases stay here.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Release phase to run
        required: true
        type: choice
        options: [native, sdk]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # `npm stage` requires npm 11.15.0 or newer.
  NPM_VERSION: "11.15.0"

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  notify-start:
    name: Notify Slack that the release is starting
    if: inputs.phase == 'sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read SDK version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        continue-on-error: true
        uses: ./.github/actions/notify-release
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          package: TypeScript SDK (npm)
          version: ${{ steps.version.outputs.version }}
          package-url: https://www.npmjs.com/package/@tensorlakeai/tensorlake/v/${{ steps.version.outputs.version }}

  build-sdk-and-test:
    name: Build SDK and test
    if: inputs.phase == 'sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Reject install lifecycle scripts
        run: node ./scripts/check-no-install-scripts.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build SDK
        run: npm run build:sdk

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: |
            typescript/dist
            typescript/runtime

  build-native-binaries:
    name: Build native binding (${{ matrix.target_id }})
    if: inputs.phase == 'native'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_id: linux-x64
            rust_target: x86_64-unknown-linux-gnu.2.28
            rust_target_base: x86_64-unknown-linux-gnu
            libc: gnu
            native_build_tool: cargo-zigbuild
          - os: ubuntu-24.04-arm
            target_id: linux-arm64
            rust_target: aarch64-unknown-linux-gnu.2.28
            rust_target_base: aarch64-unknown-linux-gnu
            libc: gnu
            native_build_tool: cargo-zigbuild
          - os: ubuntu-latest
            target_id: linux-x64-musl
            rust_target: x86_64-unknown-linux-musl
            rust_target_base: x86_64-unknown-linux-musl
            libc: musl
            native_build_tool: cargo-zigbuild
          - os: ubuntu-24.04-arm
            target_id: linux-arm64-musl
            rust_target: aarch64-unknown-linux-musl
            rust_target_base: aarch64-unknown-linux-musl
            libc: musl
            native_build_tool: cargo-zigbuild
          - os: macos-14
            target_id: darwin-arm64
            rust_target: ""
            rust_target_base: ""
            libc: ""
            native_build_tool: cargo
          - os: windows-latest
            target_id: win32-x64
            rust_target: ""
            rust_target_base: ""
            libc: ""
            native_build_tool: cargo
    steps:
      - uses: actions/checkout@v4

      - name: Vendor canonical Function Agent core
        uses: ./.github/actions/vendor-function-agent-core
        with:
          app-id: ${{ secrets.COMPUTE_ENGINE_APP_ID }}
          private-key: ${{ secrets.COMPUTE_ENGINE_APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: typescript/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Setup Zig
        if: matrix.native_build_tool == 'cargo-zigbuild'
        uses: mlugg/setup-zig@v2

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-bin
          cache-bin: false

      - name: Install cargo-zigbuild
        if: matrix.native_build_tool == 'cargo-zigbuild'
        run: cargo install cargo-zigbuild --locked

      - name: Install Rust target
        if: matrix.rust_target_base != ''
        run: rustup target add ${{ matrix.rust_target_base }}

      - name: Reject install lifecycle scripts
        run: node ./scripts/check-no-install-scripts.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native binding
        run: npm run build:native
        env:
          TENSORLAKE_NODE_TARGET_ID: ${{ matrix.target_id }}
          TENSORLAKE_NODE_TARGET_TRIPLE: ${{ matrix.rust_target }}
          TENSORLAKE_NODE_BUILD_TOOL: ${{ matrix.native_build_tool }}

      - name: Verify Linux native libc compatibility
        if: startsWith(matrix.target_id, 'linux-')
        run: |
          set -euo pipefail
          binding="dist/native/${{ matrix.target_id }}/tensorlake-node.node"
          required_versions="$(readelf --version-info "$binding" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)"
          max_glibc="$(printf '%s\n' "$required_versions" | tail -n1)"
          echo "Maximum required glibc: ${max_glibc:-none}"
          if [ "${{ matrix.libc }}" = "musl" ] && [ -n "$max_glibc" ]; then
            echo "Musl native binding unexpectedly references glibc symbols."
            exit 1
          fi
          if [ "${{ matrix.libc }}" = "gnu" ] && [ -n "$max_glibc" ] && [ "$(printf '%s\n%s\n' "GLIBC_2.28" "$max_glibc" | sort -V | tail -n1)" != "GLIBC_2.28" ]; then
            echo "Native binding requires $max_glibc, above the GLIBC_2.28 compatibility floor."
            exit 1
          fi

      - name: Verify native cloud transport on host targets
        if: "!endsWith(matrix.target_id, '-musl')"
        run: npm run test:native-cloud

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target_id }}
          path: typescript/dist/native/${{ matrix.target_id }}

  stage-native-binaries:
    name: Stage native package (${{ matrix.target_id }})
    if: inputs.phase == 'native'
    needs:
      - build-native-binaries
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ matrix.package_name }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: linux-x64
            package_name: "@tensorlakeai/native-linux-x64-gnu"
          - target_id: linux-arm64
            package_name: "@tensorlakeai/native-linux-arm64-gnu"
          - target_id: linux-x64-musl
            package_name: "@tensorlakeai/native-linux-x64-musl"
          - target_id: linux-arm64-musl
            package_name: "@tensorlakeai/native-linux-arm64-musl"
          - target_id: darwin-arm64
            package_name: "@tensorlakeai/native-darwin-arm64"
          - target_id: win32-x64
            package_name: "@tensorlakeai/native-win32-x64"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with staged publishing
        run: |
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          npm --version

      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target_id }}
          path: typescript/npm/${{ matrix.target_id }}

      - name: Verify native package contents
        run: |
          test -f "npm/${{ matrix.target_id }}/tensorlake-node.node"
          test "$(node -p "require('./npm/${{ matrix.target_id }}/package.json').name")" = "${{ matrix.package_name }}"
          npm pack "./npm/${{ matrix.target_id }}" --dry-run --ignore-scripts

      - name: Stage native package on npm
        working-directory: typescript/npm/${{ matrix.target_id }}
        env:
          npm_config_ignore_scripts: "true"
        run: npm stage publish --access public --provenance

  stage-sdk:
    name: Stage SDK on npm
    if: inputs.phase == 'sdk'
    needs:
      - build-sdk-and-test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tensorlakeai/tensorlake
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with staged publishing
        run: |
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          npm --version

      - name: Require approved native packages
        run: |
          version="$(node -p "require('./package.json').version")"
          packages="$(node -p "Object.keys(require('./package.json').optionalDependencies).join(' ')")"
          # Newly approved versions can take a short while to become visible.
          for attempt in $(seq 1 12); do
            missing=""
            for package in $packages; do
              if [ -z "$(npm view "${package}@${version}" dist.integrity 2>/dev/null)" ]; then
                missing="$missing $package"
              fi
            done
            [ -z "$missing" ] && exit 0
            echo "Waiting for${missing} @ ${version} (attempt ${attempt}/12)"
            sleep 10
          done
          for package in $missing; do
            echo "::error::${package}@${version} is not public. Run the 'native' phase and approve its staged packages first."
          done
          exit 1

      - name: Reject install lifecycle scripts
        run: node ./scripts/check-no-install-scripts.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lock published native package checksums
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: typescript

      - name: Verify package contents
        run: |
          npm run build:runtime
          test -f runtime/typescript-function-runner/manifest.json
          test -z "$(find dist runtime -type f -name '*.node' -print -quit)"
          npm pack --dry-run --ignore-scripts

      - name: Stage SDK on npm
        env:
          npm_config_ignore_scripts: "true"
        run: npm stage publish --access public --provenance

  # npm currently blocks publishing to the `tensorlake` name, so the wrapper is
  # staged last and a failure here does not fail the release.
  stage-wrapper:
    name: Stage tensorlake wrapper on npm
    if: inputs.phase == 'sdk'
    needs:
      - stage-sdk
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/tensorlake
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript/tensorlake-wrapper
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with staged publishing
        run: |
          npm install --global --ignore-scripts "npm@${NPM_VERSION}"
          npm --version

      - name: Verify wrapper pins this SDK release
        run: |
          sdk_version="$(node -p "require('../package.json').version")"
          test "$(node -p "require('./package.json').version")" = "$sdk_version"
          test "$(node -p "require('./package.json').dependencies['@tensorlakeai/tensorlake']")" = "$sdk_version"
          npm pack --dry-run --ignore-scripts

      - name: Stage wrapper on npm
        env:
          npm_config_ignore_scripts: "true"
        run: npm stage publish --access public --provenance
