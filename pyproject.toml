[project]
name = "tensorlake"
version = "0.6.0"
description = "Tensorlake SDK for agent sandboxes"
readme = "README.md"
authors = [{ name = "Tensorlake Inc.", email = "support@tensorlake.ai" }]
requires-python = ">=3.10"
dependencies = [
    # Security floors for HTTPX's runtime dependency graph also apply to pip consumers.
    "anyio>=4.14.2,<5.0",
    "h2>=4.4.1,<5.0",
    "hpack>=4.2.0,<5.0",
    "idna>=3.15,<4.0",
    "httpx[http2]>=0.27.2,<1.0",
    "websocket-client>=1.8.0,<2.0",
    "websockets>=14.0,<18.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/tensorlakeai/tensorlake"
Repository = "https://github.com/tensorlakeai/tensorlake"

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/rust-cloud-sdk-py/Cargo.toml"
module-name = "tensorlake._cloud_sdk"
python-source = "src"
include = [
    { path = "LICENSE", format = "sdist" },
]

[tool.black]
target-version = ["py310"]
extend-exclude = '''
/(
  crates
)/
'''

[tool.isort]
profile = "black"
extend_skip = ["crates"]
skip_gitignore = true

[tool.poetry.group.dev.dependencies]
black = "26.10.1"
parameterized = "^0.9.0"
respx = "^0.22.0"
isort = "^8.0.0"
# Patched virtualenv/filelock tooling requires Python 3.11; runtime still supports 3.10.
pre-commit = { version = "^4.5.1", python = ">=3.11" }
maturin = ">=1.9,<2.0"
