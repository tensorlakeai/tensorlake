# Security policy applies to registry dependencies and frozen-lockfile installs.
minimumReleaseAge: 1440 # 24 hours, in minutes
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
ignoreScripts: true
optimisticRepeatInstall: false

# Source builds produce native artifacts locally; do not fetch this release from npm.
ignoredOptionalDependencies:
  - "@tensorlakeai/native-*"
